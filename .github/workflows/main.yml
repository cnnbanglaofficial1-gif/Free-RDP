name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download Ngrok Binary
      run: |
        Invoke-WebRequest -Uri https://equinox.io -OutFile ngrok.zip
        Expand-Archive -Path ngrok.zip -DestinationPath .
    - name: Authenticate Ngrok
      run: |
        ./ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Set User Password
      run: |
        $Password = ConvertTo-SecureString "Ghitl@Auto2026" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Start Ngrok Tunnel and Keep Alive
      run: |
        Start-Process ./ngrok.exe -ArgumentList "tcp 3389"
        Write-Host "RDP Server successfully started. Keeping tunnel alive..."
        for ($i = 0; $i -lt 216; $i++) {
            Start-Sleep -Seconds 100
        }
