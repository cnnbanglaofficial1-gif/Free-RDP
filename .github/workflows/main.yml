name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Set up Chocolatey and Ngrok
      run: |
        choco install ngrok -y
    - name: Authenticate Ngrok
      run: |
        ngrok authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Set User Password
      run: |
        $Password = ConvertTo-SecureString "Ghitl@Auto2026" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Start Ngrok Tunnel and Keep Alive
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"
        Write-Host "RDP Server সফলভাবে চালু হয়েছে। টানেল সচল রাখার জন্য লুপ চলছে..."
        # ৬ ঘণ্টা (২১৬০০ সেকেন্ড) সার্ভারটি ধরে রাখার জন্য ব্যাকগ্রাউন্ড লুপ
        for ($i = 0; $i -lt 216; $i++) {
            Start-Sleep -Seconds 100
        }
