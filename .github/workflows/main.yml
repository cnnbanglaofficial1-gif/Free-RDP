name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download Ngrok
      run: |
        Invoke-WebRequest https://github.com -OutFile ngrok.zip
        Expand-Archive ngrok.zip
    - name: Authenticate Ngrok
      run: |
        .\ngrok-go_0.6.0_windows_amd64\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Set User Password
      run: |
        $Password = ConvertTo-SecureString "Ghitl@Auto2026" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Start Ngrok Tunnel
      run: |
        Start-Process .\ngrok-go_0.6.0_windows_amd64\ngrok.exe -ArgumentList "tcp 3389"
        Start-Sleep -Seconds 10
